# Sobrescreve /usr/share/sway/config.d/90-swayidle.conf (mesmo nome = prioridade)
# 5 min ocioso: bloqueia e desliga a tela juntos.
# Bloqueio manual ($mod+Escape / loginctl lock-session): tela apaga após 60s.
exec swayidle -w \
    timeout 300 'swaylock -f && swaymsg "output * power off"' \
         resume 'swaymsg "output * power on"' \
    timeout 60 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power off"' \
         resume 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power on"' \
    before-sleep 'swaylock -f' \
    lock 'swaylock -f' \
    unlock 'pkill -xu "$USER" -SIGUSR1 swaylock'
